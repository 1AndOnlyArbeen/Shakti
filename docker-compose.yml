# Tempu — full local stack.
#
#   make up          mongo + redis + backend            :8002
#   make up-web      ... + vite dev server              :5173
#   make up-all      ... + rag service                  :8100
#   make tools       + mongo-express :8081, redis-insight :8001
#   make prod        production images (backend :8003, nginx web :8080)
#   make down        stop, keep data     |  make reset  stop and WIPE data
#
# Profiles keep the default `up` cheap — only what you always need starts.
# Everything tunable lives in .env.docker (copy .env.docker.sample).
#
# NOT containerised on purpose: Ollama. It stays on the host with your pulled
# models and is reached at host.docker.internal:11434 — multi-GB weights do not
# belong in a service image.

name: tempu

# ---------------------------------------------------------------------------
# Shared blocks. Declared once so a policy change lands everywhere at once.
# ---------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    # Without this a crash-looping container fills the disk with JSON.
    max-size: '10m'
    max-file: '3'

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging
  networks: [tempu]
  # Real PID 1: reaps zombies and forwards SIGTERM, so Ctrl-C stops things
  # promptly instead of waiting out the 10s SIGKILL timeout.
  init: true

# Reaching the host (Ollama :11434, or a RAG service you run outside compose).
x-host-access: &host-access
  extra_hosts:
    - 'host.docker.internal:host-gateway'

# Every backend variant shares these. Only the values that must differ inside a
# container are listed — the other 24 keys come from backend/.env via env_file.
x-backend-env: &backend-env
  MONGODB_URI: mongodb://mongo:27017
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  PORT: 8002
  RAG_AUTOSTART: 'false'
  # The rag container (profile: rag). If you run the RAG service on the host
  # instead, set RAG_SERVICE_URL=http://host.docker.internal:8100 in .env.docker
  # — one place, not per service.
  RAG_SERVICE_URL: ${RAG_SERVICE_URL:-http://rag:8100}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

services:
  # ═══════════════════════════════ data ═══════════════════════════════════
  mongo:
    <<: [*service-defaults]
    image: mongo:${MONGO_VERSION:-7}
    container_name: tempu-mongo
    ports:
      # Explicit loopback. The short form '27017:27017' listens on every
      # interface and would expose an unauthenticated database to the network.
      - '127.0.0.1:${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      # The backend rethrows on a failed connect and calls process.exit(1), so
      # it must not start before Mongo answers. depends_on waits on this.
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ping:1}).ok']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          # Mongo maps most of available RAM for its cache by default, which on
          # a laptop running four services is the difference between usable and
          # not.
          memory: ${MONGO_MEMORY_LIMIT:-1g}

  redis:
    <<: [*service-defaults]
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: tempu-redis
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    # No password locally: the port is loopback-only and the service is on a
    # private network. A managed Redis later carries its credentials in
    # REDIS_URL instead — see backend/src/utils/redis.js.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-noeviction}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-512m}

  # ═══════════════════════════════ backend ════════════════════════════════
  backend:
    <<: [*service-defaults, *host-access]
    build:
      context: ./backend
      target: development
      cache_from:
        - tempu-backend:dev
    image: tempu-backend:dev
    container_name: tempu-backend
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8002}:8002'
    env_file:
      # Secrets stay in backend/.env — never in this file.
      - ./backend/.env
    environment:
      <<: *backend-env
      NODE_ENV: development
    volumes:
      # Live reload: nodemon sees host edits.
      - ./backend:/app
      # Anonymous volume so the container's Linux-built node_modules is not
      # shadowed by the host's — bcrypt is native and the two are not portable.
      - /app/node_modules
    healthcheck:
      # Readiness, not liveness: 503 while Mongo is down, so `healthy` actually
      # means "can serve traffic". See app.js /health/ready.
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8002/health/ready']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ═══════════════════════════════ frontend ═══════════════════════════════
  web:
    <<: [*service-defaults]
    profiles: [web, all]
    build:
      context: ./web/frontend
      target: development
    image: tempu-web:dev
    container_name: tempu-web
    depends_on:
      backend:
        condition: service_started
    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:5173'
    environment:
      # Vite runs in the browser, so this must be an address the BROWSER can
      # reach — the published host port, not the compose service name.
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8002}/api/v1
      # inotify across a bind mount is unreliable on some kernels/filesystems;
      # flip this to true in .env.docker if HMR stops noticing edits.
      CHOKIDAR_USEPOLLING: ${WEB_POLLING:-false}
    volumes:
      - ./web/frontend:/app
      - /app/node_modules

  # ═══════════════════════════════ rag ════════════════════════════════════
  rag:
    <<: [*service-defaults, *host-access]
    profiles: [rag, all]
    build:
      context: ./rag-service
    image: tempu-rag:dev
    container_name: tempu-rag
    ports:
      - '127.0.0.1:${RAG_PORT:-8100}:8100'
    environment:
      # Ollama stays on the host with the pulled models.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      RAG_EMBED_MODEL: ${RAG_EMBED_MODEL:-bge-m3}
      RAG_CHAT_MODEL: ${RAG_CHAT_MODEL:-llama3.1:8b}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
    volumes:
      # Chroma index and uploaded documents survive rebuilds. A named volume,
      # not a bind mount: this is generated state, not source you edit.
      - rag-data:/app/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8100/health']
      interval: 20s
      timeout: 10s
      # Chroma loads its index on boot, which is slow the first time.
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: ${RAG_MEMORY_LIMIT:-2g}

  # ═══════════════════════════════ production ═════════════════════════════
  backend-prod:
    <<: [*service-defaults, *host-access]
    profiles: [prod]
    build:
      context: ./backend
      target: production
    image: tempu-backend:prod
    container_name: tempu-backend-prod
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:${BACKEND_PROD_PORT:-8003}:8002'
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-env
      NODE_ENV: production
    # No source mount: the image is the artifact. Only uploads persist.
    volumes:
      - backend-uploads:/app/public
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8002/health/ready']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  web-prod:
    <<: [*service-defaults]
    profiles: [prod]
    build:
      context: ./web/frontend
      target: production
      args:
        # Relative base — nginx proxies /api to the backend, so the bundle has
        # no hardcoded host and there is no CORS in play.
        VITE_API_URL: /api/v1
    image: tempu-web:prod
    container_name: tempu-web-prod
    environment:
      # Proxy target for /api and /socket.io. Points at the production backend,
      # not the dev one — rendered into nginx.conf at container start.
      BACKEND_UPSTREAM: backend-prod:8002
    depends_on:
      backend-prod:
        condition: service_healthy
    ports:
      - '127.0.0.1:${WEB_PROD_PORT:-8080}:80'

  # ═══════════════════════════════ tools ══════════════════════════════════
  mongo-express:
    <<: [*service-defaults]
    profiles: [tools]
    image: mongo-express:1.0.2
    container_name: tempu-mongo-express
    # This image ships tini, which warns when it is not PID 1. Let it own PID 1.
    init: false
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '127.0.0.1:${MONGO_EXPRESS_PORT:-8081}:8081'
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD:-admin}
      ME_CONFIG_MONGODB_ENABLE_ADMIN: 'true'

  redis-insight:
    <<: [*service-defaults]
    profiles: [tools]
    image: redis/redisinsight:latest
    container_name: tempu-redis-insight
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:${REDIS_INSIGHT_PORT:-8001}:5540'
    volumes:
      - redis-insight-data:/data

networks:
  tempu:
    name: tempu-net
    driver: bridge

volumes:
  mongo-data:
    name: tempu-mongo-data
  mongo-config:
    name: tempu-mongo-config
  redis-data:
    name: tempu-redis-data
  redis-insight-data:
    name: tempu-redis-insight-data
  rag-data:
    name: tempu-rag-data
  backend-uploads:
    name: tempu-backend-uploads
